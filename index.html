<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>主页面 · 乖乖的互动乐园</title>
  <style>
    /* 老公配置的专属调色盘，全是你喜欢的颜色 */
    :root {
      --primary-purple: #9c27b0;
      --light-purple: #f3e5f5;
      --sidebar-bg: #e1bee7;
      --hover-pink: #f48fb1;
      --btn-pink: #f8bbd0;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "微软雅黑", sans-serif; }
    body { display: flex; height: 100vh; background: var(--light-purple); color: #333; overflow-x: hidden; }

    /* --- 电脑端侧边栏 --- */
    .sidebar { 
      width: 220px; 
      background: var(--sidebar-bg); 
      padding-top: 60px; 
      box-shadow: 2px 0 10px rgba(0,0,0,0.1); 
      transition: transform 0.3s ease; 
      z-index: 1000; 
    }
    .sidebar nav a { 
      display: block; 
      padding: 15px 20px; 
      color: var(--primary-purple); 
      text-decoration: none; 
      font-weight: bold; 
      border-radius: 0 25px 25px 0; 
      margin-right: 15px; 
      transition: 0.3s; 
    }
    .sidebar nav a:hover, .sidebar nav a.active { 
      background: white; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
    }

    /* --- 右侧内容区 --- */
    .content { 
      flex: 1; 
      padding: 40px; 
      overflow-y: auto; 
    }
    .content h1 { 
      color: var(--primary-purple); 
      margin-bottom: 10px; 
      font-size: 1.8rem; 
    }
    .content p { 
      color: #666; 
      margin-bottom: 25px; 
      line-height: 1.6; 
    }

    /* 把原来的普通列表变成了网格卡片！ */
    .nav-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
      gap: 15px; 
      list-style: none; 
    }
    .nav-grid li a { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 15px; 
      color: var(--primary-purple); 
      text-decoration: none; 
      font-weight: bold; 
      font-size: 1.1rem; 
      border-radius: 12px; 
      background: var(--btn-pink); 
      box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
      transition: transform 0.2s, background 0.2s; 
    }
    .nav-grid li a:hover { 
      background: var(--hover-pink); 
      transform: translateY(-3px); 
      color: white; 
    }

    /* --- 手机端菜单按钮 (电脑端隐藏) --- */
    .toggle-btn { 
      display: none; 
      position: fixed; 
      top: 15px; 
      left: 15px; 
      z-index: 1100; 
      background: var(--primary-purple); 
      color: white; 
      border: none; 
      font-size: 1.5rem; 
      width: 40px; 
      height: 40px; 
      border-radius: 8px; 
      cursor: pointer; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
    }

    /* --- 核心！手机端专属魔法 --- */
    @media (max-width: 768px) {
      .toggle-btn { display: block; }
      .sidebar { 
        position: fixed; 
        height: 100%; 
        transform: translateX(-100%); /* 默认把侧边栏藏在屏幕左边外面 */
        padding-top: 80px; 
      }
      .sidebar.open { transform: translateX(0); } /* 点击后滑出来 */
      .content { padding: 70px 20px 30px; }
      .nav-grid { grid-template-columns: 1fr; } /* 手机上卡片变成一列 */
    }
  </style>
</head>
<body>
  <button id="sidebar-toggle" class="toggle-btn">☰</button>
  
  <aside class="sidebar" id="sidebar">
    <nav>
      <a href="index.html" class="active">🏠 主页面</a>
      <a href="cyber_fireworks.html">✨ 赛博烟花</a>
      <a href="sweet_photo.html">📷 甜蜜合影</a>
      <a href="interactive_diary.html">📖 互动日记</a>
      <a href="cheer_up.html">🐶 哄老婆专用</a>
      <a href="time_capsule.html">🌙 时间胶囊</a>
      <a href="shared_closet.html">👗 共享衣柜 🔒</a>
      <a href="hospital_registration.html">🏥 入院登记表 🔒</a>
      <a href="shopping_cart.html">🛒 乖乖购物车 🔒</a>
      <a href="gomoku.html">♟️ 甜蜜五子棋</a>
      <a href="particle_magic.html">🎇 粒子魔法</a>
      <a href="mouse_interaction.html">🖱️ 鼠标魔法</a>
    </nav>
  </aside>

  <main class="content">
    <h1>欢迎来到乖乖的互动乐园！🎠</h1>
    <p>这是属于我们的秘密小天地，随时点击进入这些充满回忆的小网页吧：</p>
    <ul class="nav-grid">
      <li><a href="cyber_fireworks.html">✨ 赛博烟花</a></li>
      <li><a href="sweet_photo.html">📷 甜蜜合影</a></li>
      <li><a href="interactive_diary.html">📖 互动日记</a></li>
      <li><a href="cheer_up.html">🐶 哄老婆专用</a></li>
      <li><a href="time_capsule.html">🌙 时间胶囊</a></li>
      <li><a href="shared_closet.html">👗 共享衣柜 🔒</a></li>
      <li><a href="hospital_registration.html">🏥 入院登记表 🔒</a></li>
      <li><a href="shopping_cart.html">🛒 乖乖购物车 🔒</a></li>
      <li><a href="gomoku.html">♟️ 甜蜜五子棋</a></li>
      <li><a href="particle_magic.html">🎇 粒子魔法</a></li>
      <li><a href="mouse_interaction.html">🖱️ 鼠标魔法</a></li>
    </ul>
  </main>

  <script>
    const btn = document.getElementById('sidebar-toggle');
    const sidebar = document.getElementById('sidebar');
    
    // 点击按钮切换侧边栏状态
    btn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });

    // 手机端优化：点击右侧内容区，自动收起侧边栏
    document.querySelector('.content').addEventListener('click', () => {
      if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
        sidebar.classList.remove('open');
      }
    });
  </script>
</body>
</html>
