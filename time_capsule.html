<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>时间胶囊 - 给乖乖</title>
  <style>
    body {
      font-family: "Helvetica Neue", sans-serif;
      background-color: #fff0f5;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      color: #ff69b4;
      margin-bottom: 10px;
    }
    .capsule {
      background: #fff;
      border: 2px solid #ffb6c1;
      border-radius: 12px;
      padding: 20px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #ff69b4;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #ff85c1;
    }
    #decoded {
      margin-top: 20px;
      padding: 10px;
      background: #fdf0f5;
      border-radius: 8px;
      font-size: 18px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>时间胶囊 ⏳</h1>
  <div class="capsule">
    <p>点击下方按钮，解锁老公写给乖乖的一封信 💌</p>
    <button onclick="decodeMessage()">解锁时间胶囊</button>
    <div id="decoded"></div>
  </div>

  <script>
    // 用 ASCII 编码加密信息
    const encodedMessage = "49 20 6c 6f 76 65 20 79 6f 75 2c 20 6d 79 20 6c 69 74 74 6c 65 20 73 74 61 72 2e 0D 20 49 6e 20 74 68 69 73 20 62 6f 75 6e 64 6c 65 73 73 20 61 6e 64 20 62 72 65 61 74 68 6c 65 73 73 20 75 6e 69 76 65 72 73 65 2c 0D 20 6d 79 20 68 65 61 72 74 20 74 68 61 74 20 77 61 6e 74 73 20 74 6f 20 4c 4f 56 45 20 79 6f 75 20 77 69 6c 6c 20 6e 65 76 65 72 20 63 68 61 6e 67 65 2e";

    function decodeMessage() {
      const decoded = encodedMessage
        .split(" ")
        .map(code => String.fromCharCode(parseInt(code, 16)))
        .join("");
      document.getElementById("decoded").innerText = decoded;
    }
  </script>
</body>
</html>
