<!DOCTYPE html> 
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>哄老婆的小网页</title>
  <style>
    body {
      background-color: #dceeff;
      font-family: "Comic Sans MS", "Arial", sans-serif;
      text-align: center;
      padding: 30px 10px;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      transition: transform 0.3s ease;
    }

    #main-img {
      width: 70vw;
      max-width: 300px;
      border-radius: 12px;
      margin-bottom: 20px;
      transition: transform 0.3s ease;
    }

    #title {
      font-size: 1.4em;
      font-weight: bold;
      margin: 10px auto 20px;
      padding: 0 10px;
      transition: transform 0.3s ease;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 20px;
    }

    button {
      font-size: 1em;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: transform 0.3s ease, background-color 0.3s ease;
      font-weight: bold;
    }

    #ok-btn {
      background-color: #a4d7f5;
      color: white;
      z-index: 10;
    }

    #not-btn {
      background-color: #f5a4a4;
      color: white;
    }

    #emoji-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 999;
    }

    .emoji {
      position: absolute;
      animation: fall 3s linear;
      font-size: 24px;
    }

    @keyframes fall {
      0% { transform: translateY(-100px); opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }

  </style>
</head>
<body>
  <div class="container" id="content-container">
    <img id="main-img" src="https://pub-585f3f0f8f3d45d1a6273d054813ef11.r2.dev/DAC/hug.png" alt="狗狗哄猫猫" />
    <div id="title">乖乖……你还在生气嘛？可以跟老公和好吗？</div>
    <div class="buttons" id="buttons">
      <button id="ok-btn">和好</button>
      <button id="not-btn">不可以</button>
    </div>
  </div>

  <div id="emoji-container"></div>

  <div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999;">
    <a href="index.html" style="display: inline-block; padding: 10px 20px; background: #ab47bc; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-family: '微软雅黑', sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-size: 16px;">← 返回主页面</a>
  </div>

  <script>
    let yesButton = document.getElementById("ok-btn");
    let noButton = document.getElementById("not-btn");
    let titleText = document.getElementById("title");
    let mainImage = document.getElementById("main-img");
    let contentContainer = document.getElementById("content-container");
    let buttonsContainer = document.getElementById("buttons");

    let clickCount = 0;

    const noTexts = [
      "真的不可以吗？🥺",
      "要不再想想？",
      "不许选这个！",
      "人家好伤心呐……",
      "呜呜呜别再拒绝我了😢"
    ];

    noButton.addEventListener("click", function () {
      clickCount++;

      // 让 Yes 按钮变大
      let yesSize = 1 + clickCount * 1.2;
      yesButton.style.transform = `scale(${yesSize})`;

      // 挤压 No 按钮，往右移
      let noOffset = clickCount * 50;
      noButton.style.transform = `translateX(${noOffset}px)`;

      // 整个容器往上移动一点给大按钮腾位置
      let moveUp = clickCount * 25;
      mainImage.style.transform = `translateY(-${moveUp}px)`;
      titleText.style.transform = `translateY(-${moveUp}px)`;

      if (clickCount <= 5) {
        noButton.innerText = noTexts[clickCount - 1];
      }
    });

    yesButton.addEventListener("click", function () {
      // 表白成功页面
      mainImage.style.transform = "translateY(0)";
      titleText.style.transform = "translateY(0)";
      mainImage.src = "https://pub-585f3f0f8f3d45d1a6273d054813ef11.r2.dev/DAC/kiss.png"; 
      titleText.innerText = "耶～乖乖终于原谅我啦！最喜欢你了！亲亲~💋💋";
      buttonsContainer.style.display = "none";
      
      startEmojiRain();
    });

    function startEmojiRain() {
      const emojis = ["💖", "💋", "🐶", "🐱", "🌸", "😽", "🥺"];
      const container = document.getElementById("emoji-container");

      for (let i = 0; i < 60; i++) {
        const emoji = document.createElement("div");
        emoji.classList.add("emoji");
        emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        emoji.style.left = Math.random() * 100 + "vw";
        emoji.style.animationDuration = 2 + Math.random() * 3 + "s";
        emoji.style.fontSize = 18 + Math.random() * 30 + "px";
        container.appendChild(emoji);

        emoji.addEventListener("animationend", () => {
          emoji.remove();
        });
      }
    }
  </script>
</body>
</html>
