        <h1>送给心月的中考祝福卡</h1>
        <p>他一直是个不声不响努力着的男孩。</p>
        <p>也许没有张扬的外表，但眼神里藏着坚定；也许没有喊出口的“我要赢”，但每次熬夜复习、咬牙刷题、默默把错题本写满的样子，都在告诉这个世界——他在准备，他在拼。</p>
        <p>这个六月，心月就要迎来他的第一场“人生战役”了。</p>
        <p>而我，作为他的家人、他的姐夫，我一直都相信：他不是为了考试而努力，他是在为自己的未来积蓄力量。</p>
        <p>不管结果如何，在我心里，他已经做得非常好了。他是那种无声拔剑，也能锋芒毕露的人。</p>
        <p>所以——加油吧，我最棒的弟弟。你努力的样子真的很帅，也很值得被骄傲地铭记。</p>
        <div class="footer">永远支持你的 姐姐 & 姐夫</div>
